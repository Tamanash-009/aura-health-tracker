spring:
  application:
    name: AuraHealth

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CLERK_ISSUER_URI:https://live-seasnail-24.clerk.accounts.dev}

  datasource:
    url: ${DB_URL:jdbc:h2:mem:aurahealthdb}
    driverClassName: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:password}
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${PORT:8080}

logging:
  level:
    org.springframework.web: INFO
    com.aurahealth: DEBUG
