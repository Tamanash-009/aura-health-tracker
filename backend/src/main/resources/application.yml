server:
  port: 8080

spring:
  application:
    name: aura-health-backend
  datasource:
    url: jdbc:mysql://localhost:3306/aura_health?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    com.aurahealth: DEBUG

