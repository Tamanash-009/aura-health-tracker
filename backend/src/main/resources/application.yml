server:
  port: 8080

spring:
  application:
    name: aura-health-backend
  datasource:
    url: jdbc:h2:mem:aura_health;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    com.aurahealth: DEBUG

app:
  jwtSecret: 357638792F423F4528482B4D6251655468576D5A7134743777217A25432A462D
  jwtExpirationMs: 86400000

