spring:
  application:
    name: aura-health-backend

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://live-seasnail-24.clerk.accounts.dev

  datasource:
    url: jdbc:h2:mem:aura_health;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: password
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
